<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เราคือ มหรรณพ.....</title>
    <style>
        /* ธีมสีชมพูสลับฟ้า (Pink & Blue Theme) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* พื้นหลังไล่สีชมพูไปฟ้าอ่อนๆ */
            background: linear-gradient(135deg, #ffd1dc 0%, #aed9e0 100%);
            background-attachment: fixed;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        
        .main-container {
            background-color: rgba(255, 255, 255, 0.95); /* พื้นหลังกล่องสีขาวโปร่งแสงนิดๆ */
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
            padding: 30px 20px;
            box-sizing: border-box;
        }

        .header-section {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px dashed #ffb6c1; /* เส้นคั่นเป็นรอยปะสีชมพู */
            padding-bottom: 20px;
        }

        .school-logo {
            width: 120px; 
            height: auto;
            margin-bottom: 15px;
            border-radius: 10px;
            /* เอาคำสั่งฟิลเตอร์ขาวดำออกแล้ว */
        }

        h1 {
            color: #00509e; /* สีน้ำเงินเข้มให้ตัวหนังสือชัดเจน */
            margin: 0;
            font-size: 26px;
            letter-spacing: 1px;
        }

        /* ตกแต่งกล่องหัวข้อพื้นฐาน */
        details {
            border-radius: 8px;
            margin-bottom: 15px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        /* สลับสีกล่อง: ข้อที่ 1 และ 3 เป็นสีชมพู */
        details:nth-of-type(odd) {
            background-color: #fff0f5; 
            border-left: 5px solid #ffb6c1;
        }
        details:nth-of-type(odd)[open] {
            background-color: #ffe4e1;
        }
        details:nth-of-type(odd) summary {
            color: #d14979; /* ตัวหนังสือสีชมพูเข้ม */
        }

        /* สลับสีกล่อง: ข้อที่ 2 เป็นสีฟ้า */
        details:nth-of-type(even) {
            background-color: #f0f8ff; 
            border-left: 5px solid #add8e6;
        }
        details:nth-of-type(even)[open] {
            background-color: #e6f2ff;
        }
        details:nth-of-type(even) summary {
            color: #00509e; /* ตัวหนังสือสีฟ้าเข้ม */
        }

        summary {
            font-weight: bold;
            font-size: 18px;
            outline: none;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        summary::after {
            content: '▼';
            font-size: 14px;
            opacity: 0.7;
        }

        details[open] summary::after {
            content: '▲';
        }

        .content-dot {
            padding-top: 15px;
            color: #555555;
            font-size: 18px;
            text-indent: 10px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <div class="header-section">
            <img src="images (35).jpeg" alt="โลโก้" class="school-logo">
            <h1>เราคือ มหรรณพ.....</h1>
        </div>

        <!-- กล่องที่ 1 (ชมพู) -->
        <details>
            <summary>1. วิธีอยู่</summary>
            <div class="content-dot">.</div>
        </details>

        <!-- กล่องที่ 2 (ฟ้า) -->
        <details>
            <summary>2. เรื่องที่ทำใจ</summary>
            <div class="content-dot">.</div>
        </details>

        <!-- กล่องที่ 3 (ชมพู) -->
        <details>
            <summary>3. สิ่งแวดล้อม</summary>
            <div class="content-dot">.</div>
        </details>

    </div>

</body>
</html>
