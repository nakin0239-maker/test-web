<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เราคือ มหรรณพ.....</title>
    <style>
        /* ธีมขาวสลับเทา (Minimal White & Gray) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eaeaea; /* พื้นหลังนอกสุดสีเทาอ่อน สบายตา */
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        
        .main-container {
            background-color: #ffffff; /* พื้นหลังกล่องกระดาษสีขาว */
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.08); /* เงาบางๆ ให้ดูมีมิติ */
            width: 100%;
            max-width: 600px;
            padding: 30px 20px;
            box-sizing: border-box;
        }

        .header-section {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0; /* เส้นคั่นสีเทาอ่อน */
            padding-bottom: 20px;
        }

        .school-logo {
            width: 120px; 
            height: auto;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        h1 {
            color: #333333; /* ตัวหนังสือสีเทาเข้มเกือบดำ */
            margin: 0;
            font-size: 26px;
            letter-spacing: 1px;
        }

        /* ตกแต่งกล่องหัวข้อพื้นฐาน */
        details {
            border-radius: 8px;
            margin-bottom: 15px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #e0e0e0; /* ขอบกล่องสีเทาอ่อน */
        }

        /* สลับสีกล่อง: ข้อที่ 1 และ 3 เป็นสีขาว */
        details:nth-of-type(odd) {
            background-color: #ffffff; 
            border-left: 5px solid #cccccc; /* แถบด้านซ้ายสีเทากลาง */
        }
        details:nth-of-type(odd)[open] {
            background-color: #fafafa;
        }
        details:nth-of-type(odd) summary {
            color: #555555;
        }

        /* สลับสีกล่อง: ข้อที่ 2 เป็นสีเทาอ่อน */
        details:nth-of-type(even) {
            background-color: #f5f5f5; 
            border-left: 5px solid #999999; /* แถบด้านซ้ายสีเทาเข้มขึ้น */
        }
        details:nth-of-type(even)[open] {
            background-color: #eeeeee;
        }
        details:nth-of-type(even) summary {
            color: #444444;
        }

        summary {
            font-weight: bold;
            font-size: 18px;
            outline: none;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        summary::after {
            content: '▼';
            font-size: 14px;
            opacity: 0.6;
        }

        details[open] summary::after {
            content: '▲';
        }

        .content-dot {
            padding-top: 15px;
            color: #666666;
            font-size: 18px;
            text-indent: 10px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <div class="header-section">
            <!-- เปลี่ยนชื่อไฟล์เป็น 1.jpg เรียบร้อยครับ -->
            <img src="1.jpg" alt="โลโก้" class="school-logo">
            <h1>เราคือ มหรรณพ.....</h1>
        </div>

        <!-- กล่องที่ 1 (สีขาว) -->
        <details>
            <summary>1. วิธีอยู่</summary>
            <div class="content-dot">.</div>
        </details>

        <!-- กล่องที่ 2 (สีเทาอ่อน) -->
        <details>
            <summary>2. เรื่องที่ทำใจ</summary>
            <div class="content-dot">.</div>
        </details>

        <!-- กล่องที่ 3 (สีขาว) -->
        <details>
            <summary>3. สิ่งแวดล้อม</summary>
            <div class="content-dot">.</div>
        </details>

    </div>

</body>
</html>
