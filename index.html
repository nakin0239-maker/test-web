<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกเอาตัวรอด</title>
    <style>
        /* ธีมขาวดำ (Monochrome / Black & White) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000000; /* พื้นหลังดำสนิท */
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #ffffff; /* ตัวหนังสือสีขาว */
        }
        
        .main-container {
            background-color: #0a0a0a; /* ดำอ่อนลงมานิดนึงให้มีมิติ */
            border-radius: 10px;
            width: 100%;
            max-width: 600px;
            padding: 30px 20px;
            box-sizing: border-box;
            border: 1px solid #333333; /* ขอบสีเทาเข้ม */
        }

        .header-section {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #333333;
            padding-bottom: 20px;
        }

        .school-logo {
            width: 120px; 
            height: auto;
            margin-bottom: 15px;
            border-radius: 10px;
            filter: grayscale(100%); /* ✨ ลูกเล่นพิเศษ: ปรับรูปภาพให้เป็นขาวดำอัตโนมัติ */
        }

        h1 {
            color: #ffffff; 
            margin: 0;
            font-size: 24px;
            letter-spacing: 1px;
        }

        /* ตกแต่งกล่องหัวข้อ */
        details {
            background-color: #111111; 
            border: 1px solid #333333;
            border-radius: 8px;
            margin-bottom: 15px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        details[open] {
            background-color: #1a1a1a;
            border-color: #ffffff; /* ตอนกดเปิดให้ขอบสว่างเป็นสีขาว */
        }

        summary {
            font-weight: bold;
            color: #cccccc; /* สีเทาสว่าง */
            font-size: 18px;
            outline: none;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* ตอนแตะหัวข้อ ให้ตัวหนังสือสว่างขึ้น */
        summary:hover {
            color: #ffffff;
        }

        summary::after {
            content: '▼';
            font-size: 14px;
            color: #777777;
        }

        details[open] summary::after {
            content: '▲';
            color: #ffffff;
        }

        .content-dot {
            padding-top: 15px;
            color: #aaaaaa; /* สีจุดด้านในเป็นสีเทา */
            font-size: 18px;
            text-indent: 10px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <div class="header-section">
            <!-- รูปภาพจะถูกเปลี่ยนเป็นขาวดำอัตโนมัติด้วย CSS -->
            <img src="images (35).jpeg" alt="โลโก้" class="school-logo">
            <h1>คู่มือเอาตัวรอด</h1>
        </div>

        <details>
            <summary>1. วิธีอยู่</summary>
            <div class="content-dot">.</div>
        </details>

        <details>
            <summary>2. เรื่องที่ทำใจ</summary>
            <div class="content-dot">.</div>
        </details>

        <details>
            <summary>3. สิ่งแวดล้อม</summary>
            <div class="content-dot">.</div>
        </details>

    </div>

</body>
</html>
