<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกเอาตัวรอด</title>
    <style>
        /* ธีมสีน้ำเงินมืด (Dark Blue Theme) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #050b14; /* สีพื้นหลังหลัก น้ำเงินเข้มเกือบดำ */
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #e2e8f0; /* สีข้อความทั่วไป (เทาสว่าง) */
        }
        
        .main-container {
            background-color: #0f172a; /* สีพื้นหลังกล่องตรงกลาง */
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.8); /* เงาเข้มๆ ให้ดูลึก */
            width: 100%;
            max-width: 600px;
            padding: 30px 20px;
            box-sizing: border-box;
            border: 1px solid #1e293b; /* ขอบกล่องสีน้ำเงินเทา */
        }

        .header-section {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #1e293b;
            padding-bottom: 20px;
        }

        .school-logo {
            width: 120px; 
            height: auto;
            margin-bottom: 15px;
            border-radius: 10px; /* ลบมุมรูปนิดนึงให้ดูสมูท */
        }

        h1 {
            color: #f8fafc; /* สีหัวข้อหลัก (ขาวสว่าง) */
            margin: 0;
            font-size: 24px;
            letter-spacing: 1px;
        }

        /* ตกแต่งกล่องหัวข้อ */
        details {
            background-color: #162032; /* สีกล่องตอนยังไม่กด */
            border: 1px solid #1e293b;
            border-radius: 8px;
            margin-bottom: 15px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        details[open] {
            background-color: #1e293b; /* สีกล่องสว่างขึ้นนิดนึงตอนกดเปิด */
            border-color: #3b82f6; /* ไฮไลต์ขอบเป็นสีฟ้า */
        }

        summary {
            font-weight: bold;
            color: #60a5fa; /* สีหัวข้อย่อย (สีฟ้าสว่าง) */
            font-size: 18px;
            outline: none;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        summary::after {
            content: '▼';
            font-size: 14px;
            color: #60a5fa;
        }

        details[open] summary::after {
            content: '▲';
        }

        .content-dot {
            padding-top: 15px;
            color: #cbd5e1;
            font-size: 18px;
            text-indent: 10px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <div class="header-section">
            <img src="images (35).jpeg" alt="โลโก้" class="school-logo">
            <h1>คู่มือเอาตัวรอด</h1>
        </div>

        <details>
            <summary>1. วิธีอยู่</summary>
            <div class="content-dot">.</div>
        </details>

        <details>
            <summary>2. เรื่องที่ทำใจ</summary>
            <div class="content-dot">.</div>
        </details>

        <details>
            <summary>3. สิ่งแวดล้อม</summary>
            <div class="content-dot">.</div>
        </details>

    </div>

</body>
</html>
