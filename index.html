<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติโรงเรียนของเรา</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        .logo-container {
            text-align: center;
            padding: 40px 20px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 90%;
            max-width: 400px;
        }

        .school-logo {
            width: 150px; 
            height: auto;
            margin-bottom: 20px;
        }

        h1 {
            color: #003366; /* สีน้ำเงินเข้มให้ดูเป็นทางการ */
            margin: 0;
            font-size: 26px;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <!-- เปลี่ยนคำว่า ชื่อไฟล์ของคุณ.jpg เป็นชื่อไฟล์โลโก้เดิมที่อยู่ใน GitHub -->
        <img src="ชื่อไฟล์ของคุณ.jpg" alt="โลโก้โรงเรียน" class="school-logo">
        <h1>ประวัติโรงเรียน</h1>
    </div>

</body>
</html>
