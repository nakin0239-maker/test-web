<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เราคือ มหรรณพ.....</title>
    <style>
        /* ธีมขาวสลับเทา (Minimal White & Gray) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eaeaea; 
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh; /* ให้ความสูงเต็มจอเพื่อดัน footer ไปล่างสุด */
        }
        
        .main-container {
            background-color: #ffffff; 
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.08); 
            width: 100%;
            max-width: 600px;
            padding: 30px 20px;
            box-sizing: border-box;
        }

        .header-section {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0; 
            padding-bottom: 20px;
        }

        /* สไตล์สำหรับตัวหนังสือ MH2/1 ที่มาแทนโลโก้ */
        .text-logo {
            font-size: 56px; /* ตัวใหญ่เบิ้มๆ */
            font-weight: 900; /* หนาพิเศษ */
            color: #222222;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        h1 {
            color: #666666; 
            margin: 0;
            font-size: 20px;
            letter-spacing: 1px;
            font-weight: normal;
        }

        /* ตกแต่งกล่องหัวข้อพื้นฐาน */
        details {
            border-radius: 8px;
            margin-bottom: 15px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #e0e0e0; 
        }

        /* สลับสีกล่อง: ข้อที่ 1 และ 3 เป็นสีขาว */
        details:nth-of-type(odd) {
            background-color: #ffffff; 
            border-left: 5px solid #cccccc; 
        }
        details:nth-of-type(odd)[open] {
            background-color: #fafafa;
        }
        details:nth-of-type(odd) summary {
            color: #555555;
        }

        /* สลับสีกล่อง: ข้อที่ 2 เป็นสีเทาอ่อน */
        details:nth-of-type(even) {
            background-color: #f5f5f5; 
            border-left: 5px solid #999999; 
        }
        details:nth-of-type(even)[open] {
            background-color: #eeeeee;
        }
        details:nth-of-type(even) summary {
            color: #444444;
        }

        summary {
            font-weight: bold;
            font-size: 18px;
            outline: none;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        summary::after {
            content: '▼';
            font-size: 14px;
            opacity: 0.6;
        }

        details[open] summary::after {
            content: '▲';
        }

        .content-dot {
            padding-top: 15px;
            color: #666666;
            font-size: 18px;
            text-indent: 10px;
            line-height: 1.6;
        }

        /* สไตล์สำหรับเวอร์ชันท้ายเว็บ */
        .footer-version {
            margin-top: auto; /* ดันข้อความไปอยู่ล่างสุดของจอเสมอ */
            padding-top: 30px;
            font-size: 13px;
            color: #999999; /* สีเทาอ่อนๆ ให้ดูเนียนตา */
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <div class="header-section">
            <!-- เอาคำว่า MH2/1 มาใส่แทนรูปภาพโลโก้ -->
            <div class="text-logo">MH2/1</div>
            <h1>เราคือ มหรรณพ.....</h1>
        </div>

        <details>
            <summary>1. วิธีอยู่</summary>
            <div class="content-dot">.</div>
        </details>

        <details>
            <summary>2. เรื่องที่ทำใจ</summary>
            <div class="content-dot">.</div>
        </details>

        <details>
            <summary>3. สิ่งแวดล้อม</summary>
            <div class="content-dot">.</div>
        </details>

    </div>

    <!-- ข้อความท้ายเว็บ -->
    <div class="footer-version">ver 0.1 bata</div>

</body>
</html>
